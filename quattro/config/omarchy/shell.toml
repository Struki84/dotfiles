# User overrides for the Omarchy shell (merged over the theme's shell.toml).
# Key reference: $OMARCHY_PATH/default/themed/shell.toml.tpl
# Apply: omarchy restart shell
#
# Palette:
#   surface   #000000 @ 0.6
#   text      #ffffff
#   border    #595959 @ 0.67, 1px
#   muted     #595959
#   alert     #a55555
#   scrim     #000000 @ 0.0

# BAR --------------------------------------------------------------------------
[bar]
background       = "#000000"
background-alpha = 0.6
text             = "#ffffff"

# BAR PANELS / FLYOUTS (network, audio, bluetooth, clock, power, OSD) ----------
[popups]
background       = "#000000"
background-alpha = 0.6
text             = "#ffffff"
border           = "#595959"
border-alpha     = 0.67
border-width     = 1

# TOOLTIPS --------------------------------------------------------------------
[tooltip]
background       = "#000000"
background-alpha = 0.6
text             = "#ffffff"
border           = "#595959"
border-alpha     = 0.67
border-width     = 1

# NOTIFICATIONS ---------------------------------------------------------------
[notifications]
background       = "#000000"
background-alpha = 0.6
text             = "#ffffff"
border           = "#595959"
border-alpha     = 0.67
border-width     = 1
countdown        = "#a55555"

# ROOT MENU (also clipboard + emojis) ----------------------------------------
[menu]
background                = "#000000"
background-alpha          = 0.6
text                      = "#ffffff"
border                    = "#595959"
border-alpha              = 0.67
border-width              = 1
scrim                     = "#000000"
scrim-alpha               = 0.0
selected-background       = "#000000"
selected-background-alpha = 1.0
selected-text             = "#ffffff"
selected-border           = "#595959"
selected-border-alpha     = 0.0

# APP LAUNCHER ----------------------------------------------------------------
[launcher]
background                = "#000000"
background-alpha          = 0.6
text                      = "#ffffff"
border                    = "#595959"
border-alpha              = 0.67
border-width              = 1
scrim                     = "#000000"
scrim-alpha               = 0.0
selected-background       = "#000000"
selected-background-alpha = 1.0
selected-text             = "#ffffff"
selected-border           = "#595959"
selected-border-alpha     = 0.0

# POLKIT (sudo / password prompts) --------------------------------------------
[polkit]
background       = "#000000"
background-alpha = 0.6
text             = "#ffffff"
text-error       = "#a55555"
border           = "#595959"
border-error     = "#a55555"
border-alpha     = 0.67
scrim            = "#000000"
scrim-alpha      = 0.0
accent           = "#ffffff"

# LOCK SCREEN (password field) ------------------------------------------------
[lock]
background       = "#000000"
background-alpha = 0.6
text             = "#ffffff"
placeholder      = "#595959"
text-error       = "#a55555"
border           = "#595959"
border-active    = "#595959"
border-error     = "#a55555"
border-alpha     = 0.67
border-width     = 1
selection        = "#ffffff"
selection-alpha  = 0.35

# IMAGE PICKER (background chooser) -------------------------------------------
# No card surface; the scrim is the backdrop.
[image-picker]
scrim                   = "#000000"
scrim-alpha             = 0.5
text                    = "#ffffff"
selected-border         = "#ffffff"
selected-border-alpha   = 1.0
unselected-border       = "#595959"
unselected-border-alpha = 0.67
