# Installed by dotfiles/kamino/setup.sh to
#   /etc/systemd/system/plexmediaserver.service.d/override.conf
# @KAMINO_MOUNT_POINTS@ and @KAMINO_FS_TYPES@ are filled in from config.env.
#
# Goal: Plex comes back on its own after every crash, exit, or reboot, with no
# one at the keyboard. That's why there's no RequiresMountsFor= here: a hard
# mount dependency cancels the start job when the NAS is down at boot, and
# Restart= never fires for a job that was cancelled. Instead, ExecStartPre
# waits for the shares, and if they're missing the start fails like a crash.
# Restart=always retries every 10 s, forever, until the NAS is back.
[Unit]
Wants=network-online.target
After=network-online.target remote-fs.target
StartLimitIntervalSec=0

[Service]
# Runs as root (+). Access every share in parallel to trigger the automount,
# then require each one to be a real SMB mount, not an empty directory.
ExecStartPre=+/bin/sh -c 'for mount_point in @KAMINO_MOUNT_POINTS@; do timeout 35 ls "$$mount_point" >/dev/null 2>&1 & done; wait; for mount_point in @KAMINO_MOUNT_POINTS@; do findmnt -n -t @KAMINO_FS_TYPES@ --mountpoint "$$mount_point" >/dev/null || { echo "NAS share $$mount_point not mounted yet, retrying in 10s" >&2; exit 1; }; done'
Restart=always
RestartSec=10
