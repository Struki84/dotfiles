version: '2'
services:
  soulseek:
    build: .
    environment:
      - PGID=1000
      - PUID=1000
    ports:
      - 6080:6080
      - 6081:6081
    volumes:
      - /Volumes/Data/Downloads/!Soulseek:/data/Soulseek Downloads
      - /Volumes/Music Library/FLAC:/data/Soulseek Shared Folder
      - appdata:/data/.SoulseekQt
      - logs:/data/Soulseek Chat Logs
    networks:
      - nginx_soulseek

volumes:
  appdata:
  downloads:
  shared:
  logs:

networks:
  nginx_soulseek:
    external: true