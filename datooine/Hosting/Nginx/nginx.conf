worker_processes 1;
 
events { 
	worker_connections 1024; 
}

http {

	server {
		listen	80;
		server_name datooine.local;

		location / {
			root /etc/nginx/html;
			index index.html;
		}
	}

	server {
		listen      80;
		server_name slsk.datooine.local;

		location / {
			proxy_pass http://192.168.0.6:6080;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection 'upgrade';
			proxy_set_header Host $host;
			proxy_cache_bypass $http_upgrade;
			client_max_body_size 500M;
		}
	}
	
	server {
		listen      80;
		server_name slsk.local;

		location / {
			proxy_pass http://192.168.0.6:6080;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection 'upgrade';
			proxy_set_header Host $host;
			proxy_cache_bypass $http_upgrade;
			client_max_body_size 500M;
		}
	}

